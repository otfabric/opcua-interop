# Machine-readable version manifest of opcua-interop. The Dockerfiles,
# pom.xml, Cargo.toml, package.json and requirements.in are the source of
# truth for a build; scripts/check-versions.py (make validate) fails when
# this file disagrees with them.
# No source archive hash is recorded: package registries and the open62541
# tag are the pins.

interop_version: "0.18.2"
contract_version: "1.0"        # docs/CLIENT_CONTRACT.md

protocol:
