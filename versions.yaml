    upstream: "go-opcua"
    repository: "https://github.com/otfabric/go-opcua"
    artifact: "go:github.com/otfabric/go-opcua"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    image: "ghcr.io/otfabric/opcua-interop-otfabric"
    build: "own/go-opcua"
