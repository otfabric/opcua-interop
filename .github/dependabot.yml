version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/open62541"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/milo"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "maven"
    directory: "/milo"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      milo-deps:
        patterns:
          - "org.eclipse.milo*"

  - package-ecosystem: "docker"
    directory: "/async-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # The async-opcua crate itself is pinned exactly (=X.Y.Z) and probed by the
  # Upstream candidates workflow; Dependabot keeps the adapter's other crates
  # current.
  - package-ecosystem: "cargo"
    directory: "/async-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "async-opcua"
      # The adapter passes certificates, keys and digests to async-opcua, so
      # these crates must be the versions async-opcua is built with (0.19:
      # x509-cert 0.2, spki 0.7, sha2 0.10, const-oid 0.9, der 0.7, ...). A 0.x
      # minor release is a breaking one in Cargo: bumping it alone puts two
      # versions of der in the graph and the build fails. They move with the
      # async-opcua pin; Dependabot offers patch releases only.
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "spki"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "const-oid"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "der"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rsa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      rustcrypto:
        patterns: ["x509-cert", "spki", "sha2", "const-oid", "der", "rsa"]

  - package-ecosystem: "docker"
    directory: "/node-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # node-opcua itself is pinned exactly (all node-opcua* packages move
  # together) and probed by the Upstream candidates workflow; Dependabot keeps
  # the adapter's dev dependencies (TypeScript, @types/node) current.
  - package-ecosystem: "npm"
    directory: "/node-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "node-opcua"
      - dependency-name: "node-opcua-*"

  - package-ecosystem: "docker"
    directory: "/asyncua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # asyncua itself is pinned exactly (asyncua==X.Y.Z in requirements.in) and
  # probed by the Upstream candidates workflow; Dependabot keeps the other
  # locked wheels of the adapter (requirements.txt) current.
  - package-ecosystem: "pip"
    directory: "/asyncua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "asyncua"
