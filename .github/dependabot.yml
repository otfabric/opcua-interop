version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/open62541"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/milo"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "maven"
    directory: "/milo"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      milo-deps:
        patterns:
          - "org.eclipse.milo*"

  - package-ecosystem: "docker"
    directory: "/async-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # The async-opcua crate itself is pinned exactly (=X.Y.Z) and probed by the
  # Upstream candidates workflow; Dependabot keeps the adapter's other crates
  # current.
  - package-ecosystem: "cargo"
    directory: "/async-opcua"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "async-opcua"
