name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# On pull requests, on main, nightly and by hand; not on every branch push as in
# the other interop repositories, because a self-test takes hours here and each
# push of a branch with a pull request would run it twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    # Nightly: catches drift in what the pinned builds fetch.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Nothing is pulled from Docker Hub: anonymous pulls are rate limited per
  # runner address and its token service times out under load. Base images
  # (pinned by digest) and build tooling come from Google's mirror of it, and
  # every registry operation is retried on transient failures (scripts/retry.sh).
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fixtures, versions, scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Unit tests of the result scripts
        run: python3 -m unittest discover -q -s scripts -p 'test_*.py'
      - name: versions.yaml matches the build files
        run: scripts/check-versions.sh
      # The newest section of RELEASE.md must be non-empty and end with "---"
      # (the GitHub release body is the text up to that line).
      - name: RELEASE.md has the notes of its newest version
        run: scripts/release-notes.sh > /dev/null
      # The version the adapters report must have a section in RELEASE.md
      # (its date may still say "unreleased"; the Release workflow requires one).
      - name: Release notes for the adapter version
        run: |
          version=$(sed -nE 's/.*"adapter\\": \{\\"name\\": \\"open62541\\", \\"version\\": \\"([0-9.]+)\\".*/\1/p' adapters/open62541/src/main.c | head -1)
          [ -n "${version}" ] || { echo "::error::cannot read adapter.version from adapters/open62541/src/main.c"; exit 1; }
          scripts/release-notes.sh "v${version}" > /dev/null \
            || { echo "::error::RELEASE.md has no section \"## v${version}\""; exit 1; }
          echo "RELEASE.md has notes for v${version}"
      - name: Fixtures
        run: python3 scripts/validate-fixtures.py --require-schema
      - name: Shellcheck
        run: make lint
      - name: No reference to a library under test
        # REQUIREMENTS.md R1: adapters, fixtures, scripts and schemas must not
        # know any consumer. Documentation may name consumers as examples.
        run: |
          if grep -rInE --exclude='*.md' 'go-opcua|otfabric/go-' adapters fixtures schemas scripts tests Makefile compose.yaml; then
            echo "::error::consumer-specific reference found"; exit 1
          fi

  # Built and self-tested natively on both architectures: no emulation.
  selftest:
    name: Build, smoke, cross-stack (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILDKIT_CACHE: gha
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The runtime token and cache URL of the gha cache backend, for make.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build images
        run: make images

      - name: Capabilities
        run: make capabilities | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Images are linux/${{ matrix.arch }}
        run: |
          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'opcua-interop-.*:dev$'); do
            got=$(docker image inspect --format '{{.Architecture}}' "${image}")
            [[ "${got}" == "${{ matrix.arch }}" ]] || { echo "::error::${image} is ${got}"; exit 1; }
          done

      - name: Smoke, cross-stack and PubSub self-tests, document schemas
        run: make documents

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p reports/logs
          for c in $(docker ps -aq --filter "label=opcua-interop.run"); do
            docker logs "$c" > "reports/logs/${c}.log" 2>&1 || true
          done

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-documents-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore
