name: Upstream
run-name: "Upstream check (${{ github.event_name }})"

# Daily check of every pin against the latest upstream: the release of every
# OPC UA stack (open62541, Milo, async-opcua, UA-.NETStandard and its GDS
# packages, node-opcua, opcua-asyncio; scripts/latest-upstream.py) and the
# digest of every base image. A stack whose pin is behind is built at the
# latest release and self-tested (once per pin -> latest pair; later runs reuse
# that result). A candidate is tested like a release: smoke test plus the
# cross-stack self-test against the pinned open62541 and Milo (make
# candidate-<adapter>). Deviations of a specific upstream version listed in
# tests/known-bugs.tsv are reported as known rather than as failures, so one
# upstream bug does not hide whether everything else works. The table goes to
# the Job Summary and to the issue "Upstream releases: pins behind the latest",
# which is opened or updated (with a comment when a new version shows up) and
# closed once every pin is current. Pins in Dockerfiles / pom.xml / Cargo.toml
# / package.json / requirements.in are never changed here (the async-opcua,
# node-opcua and asyncua candidates edit their manifest and lock file in the
# job's checkout only): a bump is a reviewed change. Shared steps:
# https://github.com/otfabric/.github/tree/main/actions.1.1
on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  # Nothing is pulled from Docker Hub: anonymous pulls are rate limited per
  # runner address and its token service times out under load. Base images
  # (pinned by digest) and build tooling come from Google's mirror of it, and
  # every registry operation is retried on transient failures (scripts/retry.sh).
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

jobs:
  images:
    name: Base images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: otfabric/.github/actions/upstream-images@v3.1.1

  candidate:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        adapter: [open62541, milo, async-opcua, dotnet, dotnet-gds, node-opcua, asyncua]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pin against upstream
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bash: -eo pipefail, so a failing lookup fails this job too.
        shell: bash
        run: scripts/latest-upstream.py "${{ matrix.adapter }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and test at the latest release
        id: test
        if: steps.resolve.outputs.update == 'yes'
        uses: otfabric/.github/actions/upstream-candidate@v3.1.1
        with:
          name: ${{ matrix.adapter }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          result-pattern: '^\[(smoke|interop)\] [0-9]+ passed'
          cache-paths: "adapters/{name} scripts tests Makefile"
          command: make "candidate-${{ matrix.adapter }}" CANDIDATE="${{ steps.resolve.outputs.latest }}"

      - name: Known deviations of the latest release
        id: known
        if: always()
        run: |
          known=$(awk -F'\t' -v a="${{ matrix.adapter }}" -v v="${{ steps.resolve.outputs.latest }}" \
            '$1 == a && $2 == v { printf "%s%s", sep, $9; sep = "; " }' tests/known-bugs.tsv)
          echo "known=${known}" >> "$GITHUB_OUTPUT"

      - name: Table row
        if: always()
        uses: otfabric/.github/actions/upstream-row@v3.1.1
        with:
          component: ${{ matrix.adapter }}
          source: ${{ steps.resolve.outputs.source }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          update: ${{ steps.resolve.outputs.update }}
          detail: ${{ steps.resolve.outcome == 'failure' && 'upstream lookup failed (see the job log)' || '' }}
          test-outcome: ${{ steps.test.outputs.outcome }}
          test-result: ${{ steps.test.outputs.result }}
          test-cached: ${{ steps.test.outputs.cached }}
          known: ${{ steps.known.outputs.known }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [images, candidate]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: otfabric/.github/actions/upstream-report@v3.1.1
        with:
          needs: ${{ toJSON(needs) }}
          notes: |
            ### To update

            - **open62541:** `ARG OPEN62541_COMMIT` in `adapters/open62541/Dockerfile` (a release tag).
            - **Milo:** `<milo.version>` in `adapters/milo/pom.xml`.
            - **async-opcua:** `async-opcua = "=X.Y.Z"` in `adapters/async-opcua/Cargo.toml`, `Cargo.lock`
              (`cargo update -p async-opcua`) and `STACK_VERSION` in `adapters/async-opcua/src/common.rs`.
            - **dotnet / dotnet-gds:** `ARG OPCUA_VERSION` in `adapters/dotnet/Dockerfile` /
              `adapters/dotnet-gds/Dockerfile` and the default in the adapter's `.csproj`.
            - **node-opcua:** `node-opcua`, `node-opcua-server-configuration` and the matching
              `node-opcua-types` (exact) in `adapters/node-opcua/package.json`, then `package-lock.json`.
            - **asyncua:** `asyncua==X.Y.Z` in `adapters/asyncua/requirements.in`, then re-lock the hashed
              `adapters/asyncua/requirements.txt`.
            - **Base image:** replace the digest in every file that pins it.
            - Mirror the pin in `versions.yaml` (`scripts/check-versions.sh` checks it). Reproduce a
              candidate with `make candidate-<adapter> CANDIDATE=<version>`; a `failure` needs the
              log of the run first. A *known deviation ... did not reproduce* is good news: drop it
              from `tests/known-bugs.tsv`.
            - Record the change in `docs/COMPATIBILITY.md` and `RELEASE.md`.
