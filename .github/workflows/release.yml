name: Release
run-name: "Release ${{ inputs.bump && format('({0}) from {1}', inputs.bump, github.ref_name) || github.ref_name }}"

# Publishes a release (see RELEASE.md, "How a release is made"). Tag push: publish
# that tag. Manual run: from the Actions tab on main with the version bump (patch
# by default); it derives the next tag from the latest vX.Y.Z tag. Either way it
# checks the tag against versions.yaml, the adapter versions and
# RELEASE.md, builds the adapter images natively per architecture, runs the full test
# gate on exactly the images it pushes, joins them into multi-arch tags, and
# only then creates the GitHub release (the RELEASE.md section, the image digests,
# manifest.json and checksums.txt) and, on a manual run, the git tag. A failed
# manual run leaves no tag behind.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/otfabric

jobs:
  # ── 1. Next version; fail fast on versions, release notes, fixtures ──────
  version:
    name: Next version and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release from the default branch only
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          if [ "${CURRENT_REF}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are only allowed from ${DEFAULT_BRANCH}, not ${CURRENT_REF}."
            exit 1
          fi

      - name: Resolve tag
        id: next
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          grep -qF "interop_version: \"${tag#v}\"" versions.yaml \
            || { echo "::error::versions.yaml does not say interop_version: \"${tag#v}\""; exit 1; }
          previous_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vxF "${tag}" | head -1 || true)"
          echo "previous_tag=${previous_tag:-none}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME}, previous: ${previous_tag:-none})"

      - name: Adapter versions and RELEASE.md section match ${{ steps.next.outputs.tag }}
        run: scripts/check-release.sh "${{ steps.next.outputs.tag }}"

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate fixtures
        run: |
          check-jsonschema --check-metaschema fixtures/schema/opcua-fixture.schema.json
          scripts/validate-fixtures.sh

  # ── 2. Build, test and push each architecture natively ────────────────────
  build:
    name: Build, test, push (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build open62541 (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: open62541
          file: open62541/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-open62541:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=open62541-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=open62541-${{ matrix.arch }}

      - name: Build Milo (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: milo
          file: milo/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-milo:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=milo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=milo-${{ matrix.arch }}

      - name: Build async-opcua (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: async-opcua
          file: async-opcua/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-async-opcua:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=async-opcua-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=async-opcua-${{ matrix.arch }}

      - name: Build UA-.NETStandard (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: dotnet
          file: dotnet/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-dotnet:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=dotnet-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dotnet-${{ matrix.arch }}

      - name: Build node-opcua (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: node-opcua
          file: node-opcua/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-node-opcua:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=node-opcua-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-opcua-${{ matrix.arch }}

      - name: Build opcua-asyncio (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: asyncua
          file: asyncua/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-asyncua:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=asyncua-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=asyncua-${{ matrix.arch }}

      - name: Build UA-.NETStandard GDS (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: dotnet-gds
          file: dotnet-gds/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/opcua-interop-dotnet-gds:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=dotnet-gds-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dotnet-gds-${{ matrix.arch }}

      - name: Images report the release version
        run: |
          for a in open62541 milo async-opcua dotnet node-opcua asyncua dotnet-gds; do
            got=$(docker run --rm "${REGISTRY}/opcua-interop-${a}:${VERSION}" print-capabilities \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["adapter"]["version"])')
            [ "v${got}" = "${VERSION}" ] || { echo "::error::${a} reports adapter.version ${got}, not ${VERSION#v}"; exit 1; }
          done

      - name: Unit tests
        run: |
          for a in open62541 milo async-opcua dotnet node-opcua asyncua dotnet-gds; do
            docker run --rm -v "${PWD}/fixtures:/fixtures:ro" "${REGISTRY}/opcua-interop-${a}:${VERSION}" test
          done

      - name: Smoke (single-adapter, cross-stack, PubSub)
        run: |
          scripts/smoke.sh open62541 "${REGISTRY}/opcua-interop-open62541:${VERSION}"
          scripts/smoke.sh milo "${REGISTRY}/opcua-interop-milo:${VERSION}"
          scripts/smoke.sh async-opcua "${REGISTRY}/opcua-interop-async-opcua:${VERSION}"
          scripts/smoke.sh dotnet "${REGISTRY}/opcua-interop-dotnet:${VERSION}"
          scripts/smoke.sh node-opcua "${REGISTRY}/opcua-interop-node-opcua:${VERSION}"
          scripts/smoke.sh cross "${REGISTRY}/opcua-interop-open62541:${VERSION}" "${REGISTRY}/opcua-interop-milo:${VERSION}" "${REGISTRY}/opcua-interop-async-opcua:${VERSION}" "${REGISTRY}/opcua-interop-node-opcua:${VERSION}"
          scripts/smoke.sh cross-dotnet "${REGISTRY}/opcua-interop-dotnet:${VERSION}" "${REGISTRY}/opcua-interop-open62541:${VERSION}" "${REGISTRY}/opcua-interop-milo:${VERSION}" "${REGISTRY}/opcua-interop-node-opcua:${VERSION}"
          scripts/smoke.sh asyncua "${REGISTRY}/opcua-interop-asyncua:${VERSION}"
          scripts/smoke.sh cross-asyncua "${REGISTRY}/opcua-interop-asyncua:${VERSION}" "${REGISTRY}/opcua-interop-open62541:${VERSION}" "${REGISTRY}/opcua-interop-milo:${VERSION}"
          scripts/smoke.sh dotnet-gds "${REGISTRY}/opcua-interop-dotnet-gds:${VERSION}"
          scripts/pubsub-smoke.sh "${REGISTRY}/opcua-interop-open62541:${VERSION}"

      - name: Graceful shutdown
        run: |
          scripts/shutdown-test.sh open62541 "${REGISTRY}/opcua-interop-open62541:${VERSION}"
          scripts/shutdown-test.sh milo "${REGISTRY}/opcua-interop-milo:${VERSION}"
          scripts/shutdown-test.sh async-opcua "${REGISTRY}/opcua-interop-async-opcua:${VERSION}"
          scripts/shutdown-test.sh dotnet "${REGISTRY}/opcua-interop-dotnet:${VERSION}"
          scripts/shutdown-test.sh node-opcua "${REGISTRY}/opcua-interop-node-opcua:${VERSION}"
          scripts/shutdown-test.sh asyncua "${REGISTRY}/opcua-interop-asyncua:${VERSION}"
          scripts/shutdown-test.sh dotnet-gds "${REGISTRY}/opcua-interop-dotnet-gds:${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images as ${{ env.VERSION }}-${{ matrix.arch }}
        run: make publish-arch VERSION="${VERSION}" ARCH=${{ matrix.arch }}

  # ── 3. Multi-arch tags and the GitHub release (nothing is built here) ─────
  release:
    name: Multi-arch manifests, tag and release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the version, minor and major image tags from the amd64 and arm64 images
        run: make publish-manifest VERSION="${VERSION}"

      - name: Digests of the multi-arch images
        id: digests
        run: |
          make -s digests VERSION="${VERSION}" | tee digests.txt
          while read -r adapter digest; do
            [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${adapter}"; exit 1; }
            echo "${adapter}=${digest}" >> "$GITHUB_OUTPUT"
          done < digests.txt

      - name: Write manifest.json, checksums.txt and the release notes
        env:
          OPEN62541_DIGEST: ${{ steps.digests.outputs.open62541 }}
          MILO_DIGEST: ${{ steps.digests.outputs.milo }}
          ASYNC_OPCUA_DIGEST: ${{ steps.digests.outputs['async-opcua'] }}
          DOTNET_DIGEST: ${{ steps.digests.outputs.dotnet }}
          NODE_OPCUA_DIGEST: ${{ steps.digests.outputs['node-opcua'] }}
          ASYNCUA_DIGEST: ${{ steps.digests.outputs.asyncua }}
          DOTNET_GDS_DIGEST: ${{ steps.digests.outputs['dotnet-gds'] }}
        run: |
          set -euo pipefail
          open62541_pin=$(sed -nE 's/^ARG OPEN62541_COMMIT=(.*)$/\1/p' open62541/Dockerfile | head -1)
          milo_pin=$(sed -nE 's|.*<milo.version>(.*)</milo.version>.*|\1|p' milo/pom.xml | head -1)
          async_opcua_pin=$(sed -nE 's/^async-opcua = \{ version = "=([0-9.]+)".*/\1/p' async-opcua/Cargo.toml | head -1)
          dotnet_pin=$(sed -nE 's/^ARG OPCUA_VERSION=(.*)$/\1/p' dotnet/Dockerfile | head -1)
          dotnet_gds_pin=$(sed -nE 's/^ARG OPCUA_VERSION=(.*)$/\1/p' dotnet-gds/Dockerfile | head -1)
          node_opcua_pin=$(jq -r '.dependencies["node-opcua"]' node-opcua/package.json)
          asyncua_pin=$(sed -nE 's/^asyncua==([0-9.]+)$/\1/p' asyncua/requirements.in | head -1)
          mosquitto_pin=$(sed -nE 's/^MOSQUITTO_IMAGE \?= (.*)$/\1/p' Makefile | head -1)
          jq -n \
            --arg version "${VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            --arg open62541 "${open62541_pin}" \
            --arg milo "${milo_pin}" \
            --arg async_opcua "${async_opcua_pin}" \
            --arg dotnet "${dotnet_pin}" \
            --arg dotnet_gds "${dotnet_gds_pin}" \
            --arg node_opcua "${node_opcua_pin}" \
            --arg asyncua "${asyncua_pin}" \
            --arg mosquitto "${mosquitto_pin}" \
            --arg open62541_image "${REGISTRY}/opcua-interop-open62541@${OPEN62541_DIGEST}" \
            --arg milo_image "${REGISTRY}/opcua-interop-milo@${MILO_DIGEST}" \
            --arg async_opcua_image "${REGISTRY}/opcua-interop-async-opcua@${ASYNC_OPCUA_DIGEST}" \
            --arg dotnet_image "${REGISTRY}/opcua-interop-dotnet@${DOTNET_DIGEST}" \
            --arg node_opcua_image "${REGISTRY}/opcua-interop-node-opcua@${NODE_OPCUA_DIGEST}" \
            --arg asyncua_image "${REGISTRY}/opcua-interop-asyncua@${ASYNCUA_DIGEST}" \
            --arg dotnet_gds_image "${REGISTRY}/opcua-interop-dotnet-gds@${DOTNET_GDS_DIGEST}" \
            '{
              version: $version,
              commit: $commit,
              platforms: ["linux/amd64", "linux/arm64"],
              upstream: { open62541: $open62541, "eclipse-milo": $milo, "async-opcua": $async_opcua, "opcfoundation-uanetstandard": $dotnet, "node-opcua": $node_opcua, "opcua-asyncio": $asyncua, "opcfoundation-uanetstandard-gds": $dotnet_gds },
              images: { open62541: $open62541_image, milo: $milo_image, "async-opcua": $async_opcua_image, dotnet: $dotnet_image, "node-opcua": $node_opcua_image, asyncua: $asyncua_image, "dotnet-gds": $dotnet_gds_image },
              broker: { mosquitto: $mosquitto }
            }' > manifest.json
          sha256sum manifest.json > checksums.txt

          {
            scripts/release-notes.sh "${VERSION}"
            echo
            echo "## Images"
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            echo "| \`${REGISTRY}/opcua-interop-open62541:${VERSION}\` | \`${OPEN62541_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-milo:${VERSION}\` | \`${MILO_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-async-opcua:${VERSION}\` | \`${ASYNC_OPCUA_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-dotnet:${VERSION}\` | \`${DOTNET_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-node-opcua:${VERSION}\` | \`${NODE_OPCUA_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-asyncua:${VERSION}\` | \`${ASYNCUA_DIGEST}\` |"
            echo "| \`${REGISTRY}/opcua-interop-dotnet-gds:${VERSION}\` | \`${DOTNET_GDS_DIGEST}\` |"
            echo
            echo "Platforms: linux/amd64, linux/arm64. Also tagged \`${VERSION%.*}\` and \`${VERSION%%.*}\`."
            echo
            echo "## Pinning in a consumer"
            echo
            echo '```text'
            echo "${REGISTRY}/opcua-interop-open62541@${OPEN62541_DIGEST}"
            echo "${REGISTRY}/opcua-interop-milo@${MILO_DIGEST}"
            echo "${REGISTRY}/opcua-interop-async-opcua@${ASYNC_OPCUA_DIGEST}"
            echo "${REGISTRY}/opcua-interop-dotnet@${DOTNET_DIGEST}"
            echo "${REGISTRY}/opcua-interop-node-opcua@${NODE_OPCUA_DIGEST}"
            echo "${REGISTRY}/opcua-interop-asyncua@${ASYNCUA_DIGEST}"
            echo "${REGISTRY}/opcua-interop-dotnet-gds@${DOTNET_GDS_DIGEST}"
            echo '```'
            echo
            echo "Upstream: open62541 ${open62541_pin}, Eclipse Milo ${milo_pin}, async-opcua ${async_opcua_pin}, UA-.NETStandard ${dotnet_pin} (GDS adapter: ${dotnet_gds_pin}), node-opcua ${node_opcua_pin}, opcua-asyncio ${asyncua_pin}; MQTT broker for the PubSub tests: \`${mosquitto_pin}\`. \`manifest.json\` records the same."
          } > release-body.md
          cat manifest.json release-body.md

      - name: Create and push the git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: opcua-interop ${{ env.VERSION }}
          body_path: release-body.md
          files: |
            manifest.json
            checksums.txt

      - name: Release summary
        run: |
          {
            echo "## Released ${VERSION} (previous: ${{ needs.version.outputs.previous_tag }})"
            echo
            cat digests.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
