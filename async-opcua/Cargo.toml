[package]
name = "opcua-interop-async-opcua"
version = "0.9.0"
edition = "2021"
publish = false
description = "opcua-interop adapter for the async-opcua (Rust) OPC UA stack"
license = "MIT"

[[bin]]
name = "opcua-interop-async-opcua"
path = "src/main.rs"

[dependencies]
# The stack under test. Pinned exactly: the adapter reports this version in
# print-capabilities and Diagnostics.StackVersion.
async-opcua = { version = "=0.19.0", features = ["server", "client", "json", "xml"] }
async-trait = "0.1"
base64 = "0.23"
chrono = "0.4"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# Certificate chain verification for --trust-list (the stack itself trusts by
# exact certificate only), same crate versions the stack uses.
x509-cert = "0.2"
der = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
arc-swap = "1"

[profile.release]
opt-level = 3
codegen-units = 4
strip = true
