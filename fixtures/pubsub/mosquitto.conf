# Minimal Eclipse Mosquitto 2.x configuration for the PubSub (MQTT) interop
# tests: one plain MQTT listener on 1883, anonymous clients, no persistence.
# Test environments only — no authentication, no TLS.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
